[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "open-dive-log"
version = "0.0.1"
description = "An open-source desktop application for logging scuba dives"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    # PySide6 6.11.1 ships a 6.13 wheel but the Cocoa plugin (libqcocoa.dylib)
    # is not loadable under Homebrew Python 3.13 on macOS arm64 — Qt's plugin
    # loader filters it out before dlopen. 6.8.x (latest verified 6.8.3) ships
    # a working Cocoa plugin for the same Python. Pinned to <6.11.
    "PySide6>=6.8,<6.11",
]

[project.optional-dependencies]
dev = [
    # pytest 9.0 made `import pygments` unconditional in
    # _pytest/_io/terminalwriter.py. Pygments is no longer a pytest
    # dependency, so on a fresh install pytest 9 crashes at import
    # time with ModuleNotFoundError. Pin to <9 until the ecosystem
    # sorts itself out. (Reproduced 2026-07-04.)
    "pytest>=8.0,<9",
    "ruff>=0.5",
]

[project.scripts]
open-dive-log = "open_dive_log.__main__:main"
synthesize-dives = "open_dive_log.synthesize:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_dive_log"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Custom markers used in the test suite. ``allow_live_db`` is the
# only opt-out from the conftest's autouse safety net; see
# tests/conftest.py for why it exists.
markers = [
    "allow_live_db: opt out of the conftest's live-DB safety net (no test should need this)",
]
