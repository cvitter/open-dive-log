name: pytest

# Runs the test suite on every push to main and on every pull request
# into main. The branch protection rules on `main` require this check
# to pass before a PR can be merged, so this is the single source of
# truth for "is the suite green?".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch on a new push; the
# previous run is now stale.
concurrency:
  group: pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # We install the project with the [dev] extra (pytest + ruff).
          # The venv is a clean throwaway, so we don't have the
          # macOS-specific PySide6 dylib corruption that bites us
          # locally — the Ubuntu runner ships a working Qt offscreen
          # plugin out of the box.
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: Run pytest
        run: |
          # On the Linux runner, the Qt platform plugin is a clean
          # install — no need for the macOS `bin/run-app.sh` dance.
          # The tests' autouse conftest fixture will skip the Qt
          # subprocess tests if libqcocoa.dylib (or the Linux
          # equivalent) is missing, so a clean failure is "test
          # needs the offscreen plugin" not "build is broken."
          QT_QPA_PLATFORM=offscreen python -m pytest --tb=short -q
